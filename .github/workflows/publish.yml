name: Publish ABO static data

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install widget renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Download last successful feed
        continue-on-error: true
        run: curl --fail --silent --show-error https://chakhan82.github.io/abo-data/data/briefing.json -o previous.json
      - name: Generate feed
        run: python collector.py --previous previous.json --output public/data/briefing.json
      - name: Generate blog widgets
        run: python widget_renderer.py --input public/data/briefing.json --output public/widgets
      - name: Validate feed
        run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
